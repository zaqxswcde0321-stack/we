<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR WEDDING INVITATION</title>
  <!-- 引入 Tailwind CSS 進行快速樣式排版 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入韓系/手寫字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Klee One', 'Noto Serif TC', serif;
      background-color: #fcfbf9;
      color: #4a4a4a;
    }
  </style>
</head>

<!-- 【修改處 1】：將 max-w-md (約 448px) 擴展為 max-w-5xl (約 1024px)，完美符合電腦大螢幕寬度 -->
<body class="max-w-5xl mx-auto shadow-xl bg-[#fcfbf9] min-h-screen pb-16 px-6 md:px-12 relative">

  <!-- 背景音樂播放器（讀取音樂檔 music.mp3） -->
  <audio id="weddingBgm" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- 右上角音樂懸浮按鈕 -->
  <button id="musicBtn" onclick="toggleMusic()" class="fixed top-6 right-6 z-50 bg-white/90 backdrop-blur-sm px-4 py-2.5 rounded-full shadow-lg border border-amber-200 text-amber-900 text-sm font-semibold focus:outline-none flex items-center space-x-1 hover:bg-amber-50 transition">
    <span id="musicIcon">🎵</span>
    <span id="musicText">播放音樂</span>
  </button>

  <script>
    const bgm = document.getElementById('weddingBgm');
    const musicIcon = document.getElementById('musicIcon');
    const musicText = document.getElementById('musicText');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        bgm.pause();
        musicIcon.innerText = '🎵';
        musicText.innerText = '播放音樂';
        isPlaying = false;
      } else {
        bgm.play().then(() => {
          musicIcon.innerText = '🎶';
          musicText.innerText = '音樂播放中';
          isPlaying = true;
        }).catch(err => {
          alert('音樂載入失敗，請確認 music.mp3 檔案是否存在！');
        });
      }
    }
  </script>

  <!-- 1. 頂部主視覺 Section -->
  <section class="text-center pt-12 pb-10 border-b border-gray-200">
    <p class="tracking-widest text-base text-gray-500 uppercase">Wedding Invitation</p>
    <h1 class="text-4xl md:text-5xl my-4 text-[#8b5a2b] font-semibold">2026 . 05 . 24</h1>
    
    <!-- 主婚紗照 hero.jpg（限制電腦版最大高度，防止大螢幕下圖片佔滿全螢幕） -->
    <div class="my-6 overflow-hidden rounded-xl shadow-lg max-w-3xl mx-auto">
      <img src="hero.jpg" alt="主婚紗照" class="w-full max-h-[70vh] object-cover">
    </div>
    <p class="text-lg md:text-xl text-gray-700 font-medium tracking-wide">將故事寫成了我們最重要的決定</p>
  </section>

  <!-- 2. 愛情故事 Section -->
  <section class="py-12 text-center border-b border-gray-200">
    <h2 class="text-2xl md:text-3xl text-[#8b5a2b] font-semibold tracking-wider">OUR LOVE STORY</h2>
    <p class="text-sm text-gray-400 mb-8">Fall in love</p>
    
    <!-- 【修改處 2】：在電腦版改為並排（2 欄）顯示照片與內容，提升大螢幕觀賞體驗 -->
    <div class="max-w-4xl mx-auto my-6 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <img src="story1.jpg" alt="故事照片 1" class="rounded-xl w-full h-80 object-cover shadow-sm">
        <img src="story2.jpg" alt="故事照片 2" class="rounded-xl w-full h-80 object-cover shadow-sm">
      </div>

      <p class="text-base md:text-lg leading-relaxed px-4 text-gray-600 max-w-2xl mx-auto py-4">
        親愛的朋友～<br>
        這十年的時光，我們一起成長。<br>
        你佔據了我的青春，我霸佔了你的年華。<br>
        許久未見，甚是想念，我們婚禮見！
      </p>
    </div>
  </section>

  <!-- 3. 宴客資訊 Section -->
  <section class="py-12 text-center border-b border-gray-200">
    <h2 class="text-2xl md:text-3xl text-[#8b5a2b] mb-2 font-semibold">ABOUT WEDDING</h2>
    <p class="text-base text-gray-500 mb-8">關於我們的婚禮</p>
    
    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-sm text-left max-w-2xl mx-auto space-y-6 border border-gray-100">
      <h3 class="font-bold text-2xl text-center text-gray-800">大中華國際美食館</h3>
      <p class="text-sm text-center text-gray-500">彰化縣和美鎮彰美路四段306號</p>
      
      <div class="border-t pt-6 space-y-4 text-base">
        <div class="flex items-center space-x-4">
          <span class="bg-[#8b5a2b] text-white px-3 py-1 rounded text-sm font-medium">11:30</span>
          <span>賓客報到 (Reception)</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="bg-[#8b5a2b] text-white px-2.5 py-1 rounded text-sm font-medium">11:45</span>
          <span>入席 (Ceremony)</span>
        </div>
        <div class="flex items-center space-x-4">
          <span class="bg-[#8b5a2b] text-white px-3 py-1 rounded text-sm font-medium">12:00</span>
          <span>宴席開始</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. RSVP 表單 Section -->
  <section class="py-12 max-w-2xl mx-auto">
    <h2 class="text-2xl md:text-3xl text-center text-[#8b5a2b] mb-8 font-semibold">婚禮禮邀邀請函 (RSVP)</h2>
    
    <form class="space-y-6 text-base">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <label class="block font-semibold mb-3 text-lg">請問是否能參加婚禮？</label>
        <div class="space-y-3">
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="radio" name="attend" value="yes" class="accent-[#8b5a2b] w-4 h-4">
            <span>參加！我們婚禮見</span>
          </label>
          <label class="flex items-center space-x-3 cursor-pointer">
            <input type="radio" name="attend" value="no" class="accent-[#8b5a2b] w-4 h-4">
            <span>當天有事無法前往，我想留下祝福</span>
          </label>
        </div>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
        <div>
          <label class="block font-semibold mb-1">您的姓名</label>
          <input type="text" placeholder="請輸入姓名" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-[#8b5a2b]">
        </div>
        <div>
          <label class="block font-semibold mb-1">手機號碼</label>
          <input type="tel" placeholder="請輸入手機號碼" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-[#8b5a2b]">
        </div>
        <div>
          <label class="block font-semibold mb-1">出席人數 (含大人與小孩)</label>
          <input type="text" placeholder="例：2大1小" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:border-[#8b5a2b]">
        </div>
      </div>

      <button type="submit" class="w-full bg-[#8b5a2b] text-white py-3.5 rounded-xl text-lg font-semibold shadow hover:bg-[#6e4620] transition duration-200">
        提交表單
      </button>
    </form>
  </section>

</body>
</html>
